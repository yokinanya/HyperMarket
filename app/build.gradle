apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

def releaseSigningFile = rootProject.file("key.properties")
def releaseSigningProperties = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def requiredSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]

android {
    namespace = "com.hyper.market"
    compileSdk = 37
    compileSdkMinor = 0

    defaultConfig {
        applicationId = "org.hyper.market"
        minSdk = 26
        targetSdk = 37
        versionCode = 412001
        versionName = "4.120.1"
        ndk {
            // Release 交付按 ABI 构建：-PreleaseAbi=arm64-v8a|armeabi-v7a（AGP 9 已移除 splits.abi）
            def releaseAbi = project.findProperty("releaseAbi")
            if (releaseAbi) {
                abiFilters releaseAbi
            }
        }
    }

    signingConfigs {
        release {
            if (requiredSigningKeys.every { releaseSigningProperties.getProperty(it) }) {
                storeFile = rootProject.file(releaseSigningProperties.getProperty("storeFile"))
                storePassword = releaseSigningProperties.getProperty("storePassword")
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix = "-debug"
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        // miuix-nav 0.9.4-rc01 以 JVM 21 字节码发布，本项目需对齐（AGP 9 内置 Kotlin 同步 jvmTarget）
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }
}

tasks.register("verifyReleaseSigningProperties") {
    doLast {
        if (!releaseSigningFile.isFile()) {
            throw new GradleException("Release signing requires key.properties")
        }
        def missing = requiredSigningKeys.findAll {
            !releaseSigningProperties.getProperty(it)
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing release signing properties: ${missing.join(', ')}")
        }
        def configuredStore = rootProject.file(releaseSigningProperties.getProperty("storeFile"))
        if (!configuredStore.isFile()) {
            throw new GradleException("Release signing storeFile does not exist")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn tasks.named("verifyReleaseSigningProperties")
    }
}

dependencies {
    implementation "androidx.core:core:1.18.0"
    implementation "androidx.activity:activity:1.12.4"
    implementation "androidx.activity:activity-compose:1.12.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "io.ktor:ktor-client-core:3.5.1"
    implementation "io.ktor:ktor-client-cio:3.5.1"
    implementation "top.yukonga.miuix.kmp:miuix-ui:0.9.3"
    implementation "top.yukonga.miuix.kmp:miuix-blur:0.9.3"
    implementation "top.yukonga.miuix.kmp:miuix-preference:0.9.3"
    implementation "top.yukonga.miuix.kmp:miuix-icons:0.9.3"
    implementation "top.yukonga.miuix.kmp:miuix-nav:0.9.4-rc01"
    implementation "top.yukonga.miuix.kmp:miuix-squircle:0.9.3"
    implementation "io.coil-kt.coil3:coil-compose:3.5.0"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.5.0"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-ui:1.10.1"
    implementation "com.xzakota.hyper.notification:focus-api:1.4"
    testImplementation "junit:junit:4.13.2"
}
